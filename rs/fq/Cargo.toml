[package]
name = "fq"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Each backend lives behind its own feature so a binary only pays
# for the implementations it actually links.  See `src/sys/`.
sys-picotls = []
sys-openssl = ["dep:openssl", "dep:openssl-sys", "dep:foreign-types"]
sys-mbedtls = ["dep:mbedtls"]
sys-fusion = []

[dependencies]
log = { version = "0.4", default-features = false }
fugit = { version = "0.3", default-features = false }
rand = { version = "0.9", default-features = false }
rand_core = { version = "0.9", default-features = false }

# Rust Crypto trait crates (no implementations -- those come from
# the active TLS backend's crypto layer, except for header
# protection which we implement ourselves).
aead = { version = "0.5", default-features = false }
cipher = { version = "0.4", default-features = false }
digest = { version = "0.10", default-features = false }

# Concrete cipher implementations used by header protection
# (QUIC packet-number encryption is QUIC logic, not TLS).
aes = { version = "0.8", default-features = false }
chacha20 = { version = "0.9", default-features = false }

# Hash, HKDF, and AEAD implementations used by the QUIC initial-secret
# derivation, retry-protection AEAD, and test-only crypto helpers in
# `tls_api`.  These are pure-Rust algorithms not specific to any TLS
# backend.
sha2 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }
hmac = { version = "0.12", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }

# UDP socket abstraction.  std-only.
socket2 = { version = "0.5", default-features = false, features = ["all"] }

# HPKE (RFC 9180) — used by the ECH opener callback to perform DHKEM
# decapsulation.  KEM algorithm support is gated per feature below.
hpke = { version = "0.12", features = ["x25519", "p256", "p384"] }

# Platform socket ancillary-data (cmsg) helpers.  Used only on Unix via
# `#[cfg(unix)]`; safe to list unconditionally.
libc = "0.2"

# Optional backend implementations (gated by `sys-*` features).
openssl = { version = "0.10", optional = true }
openssl-sys = { version = "0.9", optional = true }
foreign-types = { version = "0.3", optional = true }
mbedtls = { version = "0.13.5", optional = true, default-features = false, features = ["std", "time", "x509"] }
